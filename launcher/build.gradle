plugins {
	id 'java'
	id 'application'
}

application {
	mainClass = 'io.pzstorm.launcher.LauncherMain'
}

// The launcher must stay dependency-free: it ships as a single jar that runs
// on the JRE bundled with the game, before any game or Storm code is loaded.
dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
	// Test-only: VanillaServerImport borrows the game's driver in production
	testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.0.0'
	// Test-only: PzPasswordHash borrows the game's BCrypt in production
	testImplementation 'org.mindrot:jbcrypt:0.4'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The WSL-path tests need a real /mnt path, but no developer's home directory
// belongs in a public repo, so it comes from the gitignored local.properties.
def localProperties = providers.fileContents(
		rootProject.layout.projectDirectory.file('local.properties')).asText.map { text ->
			def props = new Properties()
			props.load(new StringReader(text))
			return props
		}.getOrElse(new Properties())

test {
	useJUnitPlatform()
	def zomboidDir = localProperties.getProperty('zomboidDir')
	if (zomboidDir) {
		systemProperty 'storm.test.zomboidDir', zomboidDir
	}
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}
}

// The launcher versions and ships independently of the workshop item: bump launcherVersion in
// gradle.properties and run deployLauncher — no workshop publish needed. Running launchers
// self-update from this URL (see CdnUpdate); the path must match deployLauncher's upload key.
def launcherUpdateUrl = "https://guspuffy.com/storm/launcher/storm-launcher.jar"

def generateLauncherProperties = tasks.register('generateLauncherProperties') {
	def outputDir = layout.buildDirectory.dir('generated/launcher-resources')
	inputs.property 'version', launcherVersion
	inputs.property 'workshopIds', "${workshopIdProd},${workshopIdStage},${workshopIdDev}"
	inputs.property 'updateUrl', launcherUpdateUrl
	outputs.dir outputDir

	doLast {
		def f = new File(outputDir.get().asFile, 'storm-launcher.properties')
		f.parentFile.mkdirs()
		f.text = "version=${inputs.properties['version']}\n" +
				"workshopIds=${inputs.properties['workshopIds']}\n" +
				"updateUrl=${inputs.properties['updateUrl']}\n"
	}
}

sourceSets.main.resources.srcDir generateLauncherProperties

jar {
	archiveFileName = 'storm-launcher.jar'
	manifest {
		attributes(
				'Main-Class': 'io.pzstorm.launcher.LauncherMain',
				'Implementation-Version': launcherVersion
				)
	}
}

// Drops the built launcher jar into the local-dev Storm install
// (<zomboidDir>/Workshop/storm/Contents/mods/storm/launcher/) so a Steam -agentpath paste
// pointing at that dir's bootstrap picks it up — no workshop-dir writes required. Pair with
// the paste in docs/launcher.md "Testing a local launcher build". Close the game first —
// Windows locks the jar while the JVM has it open. Local iteration only; deployLauncher
// above is the real ship.
tasks.register('deployLauncherLocal') {
	dependsOn tasks.named('jar')
	def jarFile = tasks.named('jar').flatMap { it.archiveFile }
	def zomboidDir = localProperties.getProperty('zomboidDir') ?: ''
	doLast {
		if (zomboidDir.isEmpty()) {
			throw new GradleException(
			"local.properties must set zomboidDir (e.g. /mnt/c/Users/<name>/Zomboid)")
		}
		def target = new File(
				"${zomboidDir}/Workshop/storm/Contents/mods/storm/launcher/storm-launcher.jar")
		if (!target.parentFile.isDirectory()) {
			throw new GradleException(
			"Local Storm install missing — run ./gradlew installStorm first"
			+ " (expected ${target.parentFile})")
		}
		java.nio.file.Files.copy(jarFile.get().asFile.toPath(), target.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		logger.lifecycle("Copied launcher ${launcherVersion} to ${target}")
	}
}

// Publishes the launcher jar for the CDN self-update: upload to S3 with the jar's SHA-256 and
// version attached as object metadata (surfaced to clients as x-amz-meta-sha256 /
// x-amz-meta-version response headers), then invalidate the CloudFront path so the very next
// launcher start sees the new build. Needs an AWS CLI with s3:PutObject on the bucket and
// cloudfront:CreateInvalidation on the distribution.
tasks.register('deployLauncher') {
	dependsOn tasks.named('jar'), tasks.named('test')
	def s3Key = 's3://guspuffy.com/storm/launcher/storm-launcher.jar'
	def invalidationPath = '/storm/launcher/storm-launcher.jar'
	def distributionId = 'E1BN2YPHZPOE9D'
	def jarFile = tasks.named('jar').flatMap { it.archiveFile }

	doLast {
		def run = { List<String> cmd ->
			def proc = new ProcessBuilder(cmd*.toString()).redirectErrorStream(true).start()
			proc.inputStream.eachLine { logger.lifecycle(it) }
			if (proc.waitFor() != 0) {
				throw new GradleException("Command failed: ${cmd.join(' ')}")
			}
		}
		def jarPath = jarFile.get().asFile
		def sha256 = java.security.MessageDigest.getInstance('SHA-256')
				.digest(jarPath.bytes).collect { String.format('%02x', it) }.join()
		logger.lifecycle("Uploading launcher ${launcherVersion} (sha256 ${sha256}) to ${s3Key}")
		run([
			'aws',
			's3',
			'cp',
			jarPath.absolutePath,
			s3Key,
			'--region',
			'us-east-1',
			'--content-type',
			'application/java-archive',
			'--metadata',
			"sha256=${sha256},version=${launcherVersion}"
		])
		logger.lifecycle("Invalidating ${invalidationPath} on distribution ${distributionId}")
		run([
			'aws',
			'cloudfront',
			'create-invalidation',
			'--distribution-id',
			distributionId,
			'--paths',
			invalidationPath
		])
	}
}
