// steamcmd only persists its refresh token to config.vdf's ConnectCache when the password is NOT on
// the command line. Supplying it makes every invocation a fresh credential auth, which trips Steam's
// login rate limiter (EResult 84) after a handful of runs. Seed the cache once with an interactive
// `~/Steam/steamcmd.sh +login <user>`; these tasks then reuse it until the token expires.
def steamLoginArgs = {
	def username = System.getenv('STEAM_USERNAME')

	if (!username) {
		throw new GradleException('STEAM_USERNAME environment variable must be set')
	}

	if (project.hasProperty('steamPasswordLogin')) {
		def password = System.getenv('STEAM_PASSWORD')

		if (!password) {
			throw new GradleException('-PsteamPasswordLogin requires the STEAM_PASSWORD environment variable')
		}

		return [username, password]
	}

	return [username]
}

String workshopDescription = '''[b]Storm[/b] is a [b]Java mod loader and modding framework[/b] for [i]Project Zomboid[/i] (Build 42+) that uses [b]Byte Buddy[/b] bytecode instrumentation to extend the game without touching its source.

Vanilla client compatibility is maintained so that players don't have to hook up any modding frameworks. The extensibility of Java modding on the server side allows you to create feature rich mods without having to modify Java on the client side.

Portable and completely deployed through Steam Workshop.

Updated to 42.20.2

Fixed TIS TileManager placement bug.
Fixed placed items not able to be placed or picked up bug.
Added headroom cap above hard coded 101 for incoming connections to fix "Getting Server Info..." dropped connections.

[url=https://github.com/guspuffygit/project-zomboid-storm]Installation and Configuration Documentation[/url]

[hr][/hr]
[url=https://ko-fi.com/guspuffy][img]https://i.imgur.com/NVyFJeG.png[/img][/url]

[h2]Sponsors[/h2]
[b][url=https://discord.gg/after-the-fall]After The Fall[/url][/b] — The #1 multiplayer server in the world
[hr][/hr]'''

def os = OperatingSystem.current()

def getLocalProperty(String property, String defaultValue = null) {
	return providers.provider {
		def props = new Properties()
		def propFile = file("local.properties")

		if (propFile.exists()) {
			propFile.withInputStream { props.load(it) }
			return props.getProperty(property, defaultValue)
		} else {
			throw new GradleException("local.properties file not found!")
		}
	}
}

apply from: 'publish.gradle'

// Bits that ship to players must never carry -SNAPSHOT: StormCoreUpdate treats a SNAPSHOT
// install as a dev working tree and refuses CDN updates on top of it (this once parked the whole
// player base on a stale build). Prod workshop uploads and CDN deploys are therefore always
// release-versioned; everything else (dev/stage, plain installStorm) keeps -SNAPSHOT so the CDN
// never overrides a local working-tree install.
boolean releaseBuild = System.getenv("STAGING") || env == 'prod' ||
		gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'deployStormJar' }
String versionSuffix = releaseBuild ? "" :
		project.ext.has('versionSuffix') ? project.ext.get('versionSuffix') : "-SNAPSHOT"

allprojects {
	repositories { mavenCentral() }
	group = 'com.sentientsimulations'
	version = "${pzVersion}_${stormVersion}" + versionSuffix
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(javaVersion as int)
		}
	}
}

