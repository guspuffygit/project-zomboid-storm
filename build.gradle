tasks.register('runStorm', JavaExec) {
	group = 'execution'
	description = 'Runs the StormLauncher application'
	mainClass = 'io.pzstorm.storm.core.StormLauncher'

	def zomboidFiles = layout.buildDirectory.dir('zomboid-classpath')

	// Add the directory (for loose .class files) AND a fileTree for the JARs
	classpath = sourceSets.main.runtimeClasspath +
			files(zomboidFiles) +
			fileTree(zomboidFiles).include('**/*.jar')

	dependsOn extractZomboidFiles

	doFirst {
		def userDir = getLocalProperty('outputDir').orElse(getLocalProperty('gameDir')).get()
		systemProperty 'user.dir', userDir

		def jvmArgsList = [
			'-Djava.awt.headless=true',
			'-Xmx12G',
			'-Xms12G',
			'-Dzomboid.steam=1',
			'-Dzomboid.znetlog=1',
			'-Dzomboid.znetlog=1',
			'-XX:+UseZGC',
		]

		if (os.isWindows()) {
			def outputDir = getLocalProperty('outputDir').get()
			jvmArgsList.add("-Djava.library.path=${outputDir}\\win64;${outputDir}")
		} else if (os.isLinux()) {
			// TODO: This is untested
			def outputDir = getLocalProperty('outputDir').get()
			jvmArgsList.add("-Djava.library.path=${outputDir}/linux64;${outputDir}")
			jvmArgsList.add('-Djava.security.egd=file:/dev/./urandom')
		} else if (os.isMacOsX()) {
			//		throw new GradleException('Not sure how to support MacOSX yet but it should be doable')
		}

		jvmArgs jvmArgsList
	}
}

tasks.register('writeWorkshopVdf') {
	def workshopDir = getLocalProperty('zomboidDir').map { "${it}/Workshop/${rootProject.name}" }
	def outputFile = layout.buildDirectory.file('workshop.vdf')

	inputs.property('appid', '108600')
	inputs.property('publishedfileid', getWorkshopId())
	inputs.property('contentfolder', workshopDir.map { "${it}/Contents" })
	inputs.property('previewfile', workshopDir.map { "${it}/preview.png" })
	inputs.property('visibility', getWorkshopVisibility())
	inputs.property('title', getWorkshopTitle())
	inputs.property('description', workshopDescription)
	inputs.property('modId', getModId())
	inputs.property('changenote', 'Deployment')

	outputs.file(outputFile)

	doLast {
		def f = outputFile.get().asFile
		f.parentFile.mkdirs()
		def workshopId = inputs.properties['publishedfileid']
		def modId = inputs.properties['modId']
		def descriptionWithFooter = inputs.properties['description'].trim() + "\n\n[hr][/hr]\nWorkshop ID: ${workshopId}\nMod ID: ${modId}"
		def escDesc = descriptionWithFooter.replace('\r', '').readLines().collect { it.replaceFirst(/^\s+/, '') }.join('\n').trim().replace('"', "'")
		def escTitle = inputs.properties['title'].replace('"', "'").replace('\r', '').replace('\n', ' ')
		f.text = [
			'"workshopitem"',
			'{',
			"\t\"appid\" \"${inputs.properties['appid']}\"",
			"\t\"publishedfileid\" \"${inputs.properties['publishedfileid']}\"",
			"\t\"contentfolder\" \"${inputs.properties['contentfolder']}\"",
			"\t\"previewfile\" \"${inputs.properties['previewfile']}\"",
			"\t\"visibility\" \"${inputs.properties['visibility']}\"",
			"\t\"title\" \"${escTitle}\"",
			"\t\"description\" \"${escDesc}\"",
			"\t\"changenote\" \"${inputs.properties['changenote']}\"",
			'}'
		].join('\n') + '\n'
	}
}

tasks.register('uploadWorkshop', Exec) {
	group = 'publishing'
	description = 'Uploads the mod to the Steam Workshop via steamcmd'

	dependsOn 'writeWorkshopVdf', 'installStorm'

	// Lets steamcmd's password/Steam Guard prompt reach the terminal when no cached token exists yet;
	// answering it interactively is what makes steamcmd persist the token for subsequent runs.
	standardInput = System.in

	doFirst {
		def steamcmdPath = "${System.getProperty('user.home')}/Steam/steamcmd.sh"
		commandLine([steamcmdPath, '+login'] + steamLoginArgs() + [
			'+workshop_build_item',
			layout.buildDirectory.file('workshop.vdf').get().asFile.absolutePath,
			'+quit'
		])
	}
}

