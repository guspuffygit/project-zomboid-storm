// Publishes storm.jar for the bootstrap's CDN self-update (see StormCoreUpdate in :bootstrap):
// upload to S3 with the jar's SHA-256 and stormVersion attached as object metadata (surfaced to
// clients as x-amz-meta-sha256 / x-amz-meta-version response headers), then invalidate the
// CloudFront path so the very next boot sees the new build. The key is versioned by game build so
// a jar can never be offered to a client on a different PZ version. Bump stormVersion in
// gradle.properties first — running bootstraps only upgrade past the workshop item's version, and
// SNAPSHOT installs never CDN-update. Dependency changes still need a workshop publish: the CDN
// channel replaces storm.jar only, not the 42/lib dist around it. Needs an AWS CLI with
// s3:PutObject on the bucket and cloudfront:CreateInvalidation on the distribution.
//
// The bootstrap reads the PZ version out of the *workshop item's* jar filename, not the running
// game. After a PZ update that shipped without a workshop publish every client is still keyed on
// the old build, so publish to that key as well: -PcdnPzVersions=42.20.3,42.20.4.
tasks.register('deployStormJar') {
	dependsOn tasks.named('jar'), tasks.named('test')
	List<String> cdnPzVersions = (project.findProperty('cdnPzVersions') ?: pzVersion).toString()
			.tokenize(',')*.trim().findAll { it }
	def distributionId = 'E1BN2YPHZPOE9D'
	def jarFile = tasks.named('jar').flatMap { it.archiveFile }

	doLast {
		def run = { List<String> cmd ->
			def proc = new ProcessBuilder(cmd*.toString()).redirectErrorStream(true).start()
			proc.inputStream.eachLine { logger.lifecycle(it) }
			if (proc.waitFor() != 0) {
				throw new GradleException("Command failed: ${cmd.join(' ')}")
			}
		}
		def jarPath = jarFile.get().asFile
		def sha256 = java.security.MessageDigest.getInstance('SHA-256')
				.digest(jarPath.bytes).collect { String.format('%02x', it) }.join()
		cdnPzVersions.each { String cdnPzVersion ->
			def s3Key = "s3://guspuffy.com/storm/core/${cdnPzVersion}/storm.jar"
			logger.lifecycle("Uploading Storm core ${stormVersion} (built for PZ ${pzVersion}, sha256 ${sha256}) to ${s3Key}")
			run([
				'aws',
				's3',
				'cp',
				jarPath.absolutePath,
				s3Key,
				'--region',
				'us-east-1',
				'--content-type',
				'application/java-archive',
				'--metadata',
				"sha256=${sha256},version=${stormVersion}"
			])
		}
		def invalidationPaths = cdnPzVersions.collect { "/storm/core/${it}/storm.jar".toString() }
		logger.lifecycle("Invalidating ${invalidationPaths.join(' ')} on distribution ${distributionId}")
		run([
			'aws',
			'cloudfront',
			'create-invalidation',
			'--distribution-id',
			distributionId,
			'--paths'
		] + invalidationPaths)
	}
}

def styluaVersion = '2.4.1'
def styluaBinaryName = os.isWindows() ? 'stylua.exe' : 'stylua'
def styluaCacheDir = layout.buildDirectory.dir("stylua/${styluaVersion}").get().asFile
def styluaBinary = new File(styluaCacheDir, styluaBinaryName)

tasks.register('installStylua') {
	group = 'verification'
	description = "Downloads StyLua v${styluaVersion} if not already cached."
	outputs.file(styluaBinary)

	doLast {
		if (styluaBinary.exists() && styluaBinary.canExecute()) {
			return
		}

		def arch = System.getProperty('os.arch')
		def normalizedArch
		if (arch == 'amd64' || arch == 'x86_64') {
			normalizedArch = 'x86_64'
		} else if (arch == 'aarch64' || arch == 'arm64') {
			normalizedArch = 'aarch64'
		} else {
			throw new GradleException("Unsupported architecture for StyLua: ${arch}")
		}

		def platform
		if (os.isMacOsX()) {
			platform = "macos-${normalizedArch}"
		} else if (os.isLinux()) {
			platform = "linux-${normalizedArch}"
		} else if (os.isWindows()) {
			platform = "windows-${normalizedArch}"
		} else {
			throw new GradleException("Unsupported OS for StyLua")
		}

		def url = "https://github.com/JohnnyMorganz/StyLua/releases/download/v${styluaVersion}/stylua-${platform}.zip"
		styluaCacheDir.mkdirs()
		def zipFile = new File(styluaCacheDir, "stylua-${platform}.zip")

		logger.lifecycle("Downloading StyLua v${styluaVersion} from ${url}")
		new URL(url).withInputStream { input ->
			zipFile.withOutputStream { it << input }
		}

		ant.unzip(src: zipFile, dest: styluaCacheDir)
		zipFile.delete()

		if (!styluaBinary.exists()) {
			throw new GradleException("StyLua binary not found at ${styluaBinary} after extraction")
		}
		styluaBinary.setExecutable(true)
	}
}

spotless {
	java {
		target 'src/**/*.java', 'zombie/**/*.java', 'launcher/src/**/*.java'
		cleanthat()
		googleJavaFormat().aosp().reflowLongStrings(false)
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '**/*.gradle'
		greclipse()
	}
	json {
		target '**/*.json'
		gson().indentWithSpaces(2)
	}
	format 'lua', {
		target 'media/lua/**/*.lua', 'src/main/resources/lua/**/*.lua', 'lua/**/*.lua'
		nativeCmd('stylua', styluaBinary.absolutePath, ['-'])
		trimTrailingWhitespace()
		endWithNewline()
	}
}

afterEvaluate {
	tasks.matching {
		it.name in [
			'spotlessLuaCheck',
			'spotlessLuaApply'
		]
	}
	.configureEach { dependsOn 'installStylua' }
}

