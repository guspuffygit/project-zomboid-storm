def isWSL() {
	try {
		def result = "cat /proc/version".execute().text
		return result.toLowerCase().contains("microsoft")
	} catch (Exception e) {
		return false
	}
}

tasks.register('runProjectZomboid') {
	doLast {
		if (os.isLinux() && isWSL()) {
			def dir = getLocalProperty('outputDir').getOrElse(getLocalProperty('gameDir').get())
			def cmd = [
				"${dir}/ProjectZomboid64.exe".toString(),
				'-DstormType=local',
				'-DLOG_LEVEL=DEBUG',
				// dev task wants the game itself, not the bootstrap's launcher hand-off
				'-Dstorm.launcher.handoff=false',
				'-Xms16g',
				'-Xmx16g',
				"-agentpath:${getLocalProperty('bootstrapDirOverride').get()}\\agentlib.dll=storm-bootstrap.jar".toString(),
				'--',
			]
			def pb = new ProcessBuilder(cmd)
			pb.directory(new File(dir))
			pb.inheritIO()
			def process = pb.start()
			def shutdownHook = new Thread({
				try {
					"taskkill.exe /F /T /IM ProjectZomboid64.exe".execute()
				} catch (Exception ignored) {}
				process.destroyForcibly()
			})
			Runtime.runtime.addShutdownHook(shutdownHook)
			def exitCode = process.waitFor()
			Runtime.runtime.removeShutdownHook(shutdownHook)
			if (exitCode != 0) {
				throw new GradleException("ProjectZomboid exited with code ${exitCode}")
			}
		}
	}
}

tasks.register('downloadWorkshop', Exec) {
	dependsOn 'uploadWorkshop'

	standardInput = System.in

	doFirst {
		def dir = getLocalProperty('serverPath').get()
		workingDir dir

		def steamcmdPath = "${System.getProperty('user.home')}/Steam/steamcmd.sh"
		commandLine([
			steamcmdPath,
			'+force_install_dir',
			dir,
			'+login'
		] + steamLoginArgs() + [
			'+workshop_download_item',
			'108600',
			getWorkshopId(),
			'validate',
			'+quit'
		])
	}
}

tasks.register('runProjectZomboidServer', Exec) {
	dependsOn 'installStorm', 'downloadWorkshop'

	standardInput = System.in
	standardOutput = System.out
	errorOutput = System.err

	doFirst {
		def dir = getLocalProperty('serverPath').get()
		def workshopModPath = "./steamapps/workshop/content/108600/${workshopIdDev}/mods/storm"
		workingDir dir

		environment 'LD_LIBRARY_PATH', "${dir}/jre64/lib:${dir}/jre64/lib/server:${System.getenv('LD_LIBRARY_PATH') ?: ''}"

		def cmd = [
			"${dir}/start-server.sh".toString(),
			"-javaagent:${workshopModPath}/bootstrap/storm-bootstrap.jar".toString(),
			'-DLOG_LEVEL=debug',
			'-Dstorm.server=true',
			// pzmcp's server target and the launcher's manifest fetch both expect this port
			'-Dstorm.http.port=41798',
			'-Dstorm.hotreload=true'
		]
		def prometheusPort = getLocalProperty('prometheusPort').getOrNull()
		if (prometheusPort) {
			cmd.add("-DprometheusPort=${prometheusPort}".toString())
		}
		def mainloopTimings = getLocalProperty('mainloopTimings').getOrNull()
		if (mainloopTimings) {
			cmd.add("-Dstorm.mainloop.timings=${mainloopTimings}".toString())
		}
		cmd.addAll(['--', '-servername', 'storm2'])
		commandLine cmd
	}
}
